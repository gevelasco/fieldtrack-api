# Postgres local para desarrollo (la API corre con `npm run start:dev` en el host).
# Si otro proyecto ya usa el puerto 5432, deja DB_PORT=5434 en .env (ver .env.example).
name: fieldtrack-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldtrack-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - fieldtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fieldtrack_postgres_data:
